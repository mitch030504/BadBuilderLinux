name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary: BadBuilder
          - os: windows-latest
            rid: win-x64
            binary: BadBuilder.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore BadBuilder.Tests/BadBuilder.Tests.csproj --locked-mode

      - name: Audit dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dotnet list BadBuilder/BadBuilder.csproj package --vulnerable --include-transitive --format json --framework net10.0 > audit.json
          count="$(jq '[.. | objects | .vulnerabilities? // empty | .[]] | length' audit.json)"
          if [ "$count" -gt 0 ]; then
            cat audit.json
            echo "Found $count vulnerable package reference(s)." >&2
            exit 1
          fi

      - name: Verify pinned XeUnshackle Max release ZIP
        if: runner.os == 'Linux'
        run: python3 scripts/verify_xeunshackle_max_release.py

      - name: Warning-free build
        run: dotnet build BadBuilder.Tests/BadBuilder.Tests.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet test BadBuilder.Tests/BadBuilder.Tests.csproj -c Release --no-build --no-restore

      - name: Publish single-file binary
        run: dotnet publish BadBuilder/BadBuilder.csproj -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o artifacts/${{ matrix.rid }}

      - name: Smoke test version (Linux)
        if: runner.os == 'Linux'
        run: artifacts/${{ matrix.rid }}/${{ matrix.binary }} --version

      - name: Smoke test version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./artifacts/${{ matrix.rid }}/${{ matrix.binary }} --version

      - name: SHA-256 (Linux)
        if: runner.os == 'Linux'
        working-directory: artifacts/${{ matrix.rid }}
        run: sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

      - name: SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: artifacts/${{ matrix.rid }}
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 '${{ matrix.binary }}').Hash.ToLowerInvariant()
          "$hash  ${{ matrix.binary }}" | Set-Content -Encoding ascii '${{ matrix.binary }}.sha256'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BadBuilder-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/${{ matrix.binary }}
            artifacts/${{ matrix.rid }}/${{ matrix.binary }}.sha256
          if-no-files-found: error
          retention-days: 7
